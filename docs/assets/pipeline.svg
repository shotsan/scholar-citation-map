<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="510" viewBox="0 0 1320 510" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1320" height="510" rx="14" fill="#ffffff" stroke="#e1e4e9"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a9b2bd"/></marker></defs>
<text x="28" y="40" fill="#1b1f24" font-size="17" font-weight="600">From a publication list to a citation map</text>
<rect x="280" y="66" width="752" height="34" rx="8" fill="#eef4f2" stroke="#bcd8d2"/>
<text x="296" y="88" fill="#1b1f24" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">python3 scripts/run.py</text>
<text x="1016" y="88" fill="#5b6570" font-size="11.5" text-anchor="end">one command runs resolve, collect and build</text>
<text x="24" y="136" fill="#5b6570" font-size="10.5" font-weight="600" letter-spacing="1.3">1 · INPUT</text>
<text x="280" y="136" fill="#5b6570" font-size="10.5" font-weight="600" letter-spacing="1.3">2 · RESOLVE</text>
<text x="536" y="136" fill="#5b6570" font-size="10.5" font-weight="600" letter-spacing="1.3">3 · COLLECT</text>
<text x="832" y="136" fill="#5b6570" font-size="10.5" font-weight="600" letter-spacing="1.3">4 · BUILD</text>
<text x="1088" y="136" fill="#5b6570" font-size="10.5" font-weight="600" letter-spacing="1.3">5 · OUTPUT</text>
<rect x="24" y="150" width="200" height="94" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<rect x="24" y="150" width="3.5" height="94" rx="1.8" fill="#c14a43"/>
<text x="39" y="175" fill="#1b1f24" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">my_papers.txt</text>
<text x="39" y="195" fill="#5b6570" font-size="11.5">One title per line, copied</text>
<text x="39" y="211" fill="#5b6570" font-size="11.5">off your Scholar profile.</text>
<text x="39" y="227" fill="#5b6570" font-size="11.5">Nothing else needed.</text>
<text x="24" y="263" fill="#8a939e" font-size="11">or a Semantic Scholar author id</text>
<rect x="280" y="150" width="200" height="94" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<rect x="280" y="150" width="3.5" height="94" rx="1.8" fill="#1a6fb5"/>
<text x="295" y="175" fill="#1b1f24" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">setup_profile.py</text>
<text x="295" y="195" fill="#5b6570" font-size="11.5">Matches each title to a</text>
<text x="295" y="211" fill="#5b6570" font-size="11.5">DOI and reads off your</text>
<text x="295" y="227" fill="#5b6570" font-size="11.5">co-author list.</text>
<rect x="280" y="256" width="200" height="23" rx="11.5" fill="#ffffff" stroke="#e1e4e9"/>
<text x="291" y="272" fill="#5b6570" font-size="11">Crossref</text>
<text x="469" y="272" fill="#8a939e" font-size="10" text-anchor="end">title → DOI</text>
<text x="280" y="300" fill="#8a939e" font-size="11">→ <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#5b6570">targets_resolved.json</tspan></text>
<rect x="536" y="150" width="240" height="94" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<rect x="536" y="150" width="3.5" height="94" rx="1.8" fill="#1e7a45"/>
<text x="551" y="175" fill="#1b1f24" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">collect_all.py</text>
<rect x="552" y="186" width="208" height="23" rx="11.5" fill="#ffffff" stroke="#e1e4e9"/>
<text x="563" y="202" fill="#5b6570" font-size="11">Semantic Scholar</text>
<text x="749" y="202" fill="#8a939e" font-size="10" text-anchor="end">8 s pacing</text>
<rect x="552" y="214" width="208" height="23" rx="11.5" fill="#ffffff" stroke="#e1e4e9"/>
<text x="563" y="230" fill="#5b6570" font-size="11">OpenAlex</text>
<text x="749" y="230" fill="#8a939e" font-size="10" text-anchor="end">daily budget</text>
<rect x="536" y="256" width="240" height="94" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<rect x="536" y="256" width="3.5" height="94" rx="1.8" fill="#7a2d8c"/>
<text x="551" y="281" fill="#1b1f24" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">collect_oc_all.py</text>
<rect x="552" y="292" width="208" height="23" rx="11.5" fill="#ffffff" stroke="#e1e4e9"/>
<text x="563" y="308" fill="#5b6570" font-size="11">OpenCitations</text>
<text x="749" y="308" fill="#8a939e" font-size="10" text-anchor="end">citing DOIs</text>
<rect x="552" y="320" width="208" height="23" rx="11.5" fill="#ffffff" stroke="#e1e4e9"/>
<text x="563" y="336" fill="#5b6570" font-size="11">Crossref</text>
<text x="749" y="336" fill="#8a939e" font-size="10" text-anchor="end">metadata</text>
<text x="536" y="370" fill="#8a939e" font-size="11">→ <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#5b6570">raw_all.json</tspan></text>
<rect x="832" y="150" width="200" height="94" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<rect x="832" y="150" width="3.5" height="94" rx="1.8" fill="#a8730d"/>
<text x="847" y="175" fill="#1b1f24" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">build.py</text>
<text x="847" y="195" fill="#5b6570" font-size="11.5">Merges the sources,</text>
<text x="847" y="211" fill="#5b6570" font-size="11.5">de-duplicates and tidies</text>
<text x="847" y="227" fill="#5b6570" font-size="11.5">affiliation strings.</text>
<rect x="832" y="310" width="200" height="66" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<rect x="832" y="310" width="3.5" height="66" rx="1.8" fill="#0f766e"/>
<text x="847" y="335" fill="#1b1f24" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">make_html.py</text>
<text x="847" y="355" fill="#5b6570" font-size="11.5">Inlines the data into one</text>
<text x="847" y="371" fill="#5b6570" font-size="11.5">standalone page.</text>
<rect x="1088" y="150" width="208" height="62" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<circle cx="1104" cy="170" r="5" fill="#a8730d"/>
<text x="1118" y="174" fill="#1b1f24" font-size="12" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">tables/</text>
<text x="1103" y="193" fill="#5b6570" font-size="11.5">4 CSVs: papers, authors,</text>
<text x="1103" y="208" fill="#5b6570" font-size="11.5">institutions, countries</text>
<rect x="1088" y="226" width="208" height="62" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<circle cx="1104" cy="246" r="5" fill="#1a6fb5"/>
<text x="1118" y="250" fill="#1b1f24" font-size="12" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">graphs/</text>
<text x="1103" y="269" fill="#5b6570" font-size="11.5">PNG, plus GraphML and</text>
<text x="1103" y="284" fill="#5b6570" font-size="11.5">GEXF for Gephi</text>
<rect x="1088" y="310" width="208" height="66" rx="9" fill="#f6f7f9" stroke="#e1e4e9"/>
<circle cx="1104" cy="330" r="5" fill="#0f766e"/>
<text x="1118" y="334" fill="#1b1f24" font-size="12" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">citation_map.html</text>
<text x="1103" y="353" fill="#5b6570" font-size="11.5">Pan, zoom, switch between</text>
<text x="1103" y="368" fill="#5b6570" font-size="11.5">papers, authors, places</text>
<line x1="228" y1="197" x2="276" y2="197" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="484" y1="197" x2="532" y2="197" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M484 212 C 508.0 212, 508.0 303, 532 303" fill="none" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M780 197 C 804.0 197, 804.0 186, 828 186" fill="none" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M780 303 C 804.0 303, 804.0 212, 828 212" fill="none" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1036" y1="181" x2="1084" y2="181" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1036" y1="212" x2="1084" y2="257" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="932" y1="248" x2="932" y2="306" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="944" y="282" fill="#8a939e" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">data/data.json</text>
<line x1="1036" y1="343" x2="1084" y2="343" stroke="#c6ced7" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="24" y1="408" x2="1296" y2="408" stroke="#e1e4e9"/>
<text x="24" y="436" fill="#5b6570" font-size="12">Google Scholar itself is not read. Its "Cited by" pages sit behind a CAPTCHA, so the four open APIs stand in for it.</text>
<text x="24" y="459" fill="#5b6570" font-size="12">Every citing paper keeps the source it came from and a self-citation flag, so coverage stays checkable.</text>
<text x="24" y="482" fill="#5b6570" font-size="12">No API keys. Set <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1b1f24">CITATION_MAP_EMAIL</tspan><tspan> so Crossref and OpenAlex serve from their faster pool.</tspan></text>
</svg>